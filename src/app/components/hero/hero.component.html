<section id="hero" class="hero-section">

  <canvas #heroCanvas class="orb-canvas"></canvas>

  <div class="hero-content">
    <div class="hero-chip">
      <span class="chip-icon"></span> {{ langService.t.hero_tag }}
    </div>

    <h1 class="hero-title">
      {{ langService.t.hero_title_1 }}
      <span class="highlight-year">2026</span>
    </h1>

    <h2 class="subtitle">{{ langService.t.hero_subtitle }}</h2>

    <div class="data-badge date-display">
      <i class="fa-regular fa-calendar"></i>
      <span>{{ langService.t.hero_date }}</span>
    </div>

    <div class="hero-gallery">
      <div class="hero-gallery-frame">
        <div class="hero-slide" *ngFor="let img of galleryImages; let i = index"
             [class.active]="i === currentSlide"
             [style.backgroundImage]="'url(' + img + ')'">
        </div>

        <button class="hero-gallery-arrow prev" (click)="goToSlide(currentSlide - 1 < 0 ? galleryImages.length - 1 : currentSlide - 1)">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="hero-gallery-arrow next" (click)="goToSlide((currentSlide + 1) % galleryImages.length)">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
      <div class="hero-gallery-counter">{{ currentSlide + 1 }} / {{ galleryImages.length }}</div>

      <a class="hero-gallery-link"
         href="https://photos.google.com/share/AF1QipPoi_RYdVCrfUVpDMr7m50vMnw2rlEQGn5RAdj52yLemPXDZGX-zLvSl2V51r1aUw?key=QUVfQ0V3elVkME5PX2x5OXBKWWNuNVkyZHA2QXVB"
         target="_blank" rel="noopener noreferrer">
        Ver álbum completo <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </a>
    </div>

    <div class="buttons">
    <!-- <button class="cta-main btn-glow" routerLink="/registro">
      {{ langService.t.hero_btn }}
    </button> -->
<!-- <button class="cta-main btn-glow" (click)="openForm()">
  {{ langService.t.hero_btn }}
</button> -->
</div>
  </div>
</section>
